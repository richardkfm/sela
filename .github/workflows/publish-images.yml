# ADR-0011: the images scripts/install.sh pulls. Three per commit, one per
# compose.yaml image name:
#   sela         the app (docker/Dockerfile `runner`), without the OSM-derived
#                basemap archive (WITH_BASEMAP=false, ADR-0005)
#   sela-tools   migrate + materialize (docker/Dockerfile `builder`, needs tsx)
#   sela-ingest  the GDAL pipeline (docker/Dockerfile.ingest)
# None carries fetched data: the ingest image downloads from the publishers on
# the user's machine, under the licence gate in ingest/01_fetch.sh.
name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Pull requests that change how the images are built get a build without a
  # push, so a broken Dockerfile shows up before it reaches main.
  pull_request:
    paths:
      - docker/**
      - compose.yaml
      - .github/workflows/publish-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sela
            dockerfile: docker/Dockerfile
            target: runner
          - image: sela-tools
            dockerfile: docker/Dockerfile
            target: builder
          - image: sela-ingest
            dockerfile: docker/Dockerfile.ingest
            target: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main → :latest; tag v0.3.0 → :0.3.0 and :0.3; every build → :sha-<short>.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      # amd64 only (owner's decision, ADR-0011): Apple Silicon runs it under
      # emulation — scripts/install.sh sets DOCKER_DEFAULT_PLATFORM for that.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: WITH_BASEMAP=false
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
