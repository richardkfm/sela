# Every sela service names both an `image` and a `build` (ADR-0011):
#   - scripts/install.sh pulls the prebuilt images from GHCR
#     (`docker compose pull`, then `up --no-build`);
#   - from a checkout, `docker compose up --build` builds them from source
#     instead. Plain `up` may use a previously pulled image rather than your
#     working tree — pass `--build` when you mean the source.
# SELA_VERSION picks the published tag: `latest` (main) or a release, e.g. 0.3.0.
# SELA_APP_PORT is the app's host port (default 3000; scripts/install.sh picks
# a free one and saves it to .env). SELA_DB_PORT gives the database a fixed
# host port on 127.0.0.1, for psql or pnpm on this machine; without it the
# database gets none that can collide.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sela}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sela}
      POSTGRES_DB: ${POSTGRES_DB:-sela}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # No fixed host port unless SELA_DB_PORT is set: Docker assigns a free one
      # on 127.0.0.1, so it can never collide (the app reaches db inside Docker).
      - "127.0.0.1:${SELA_DB_PORT:-}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sela} -d ${POSTGRES_DB:-sela}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/richardkfm/sela-tools:${SELA_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: builder
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sela:sela@db:5432/sela}
    depends_on:
      db:
        condition: service_healthy

  materialize:
    image: ghcr.io/richardkfm/sela-tools:${SELA_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: builder
    # Phase 3 (0.3.0): bridges criterion_value rows to suitability_verdict/
    # outcome rows via lib/scoring/ — see ingest/README.md "Materializing
    # scores". Run after `docker compose --profile ingest run --rm ingest
    # --fixture` (or a confirmed real ingest run); not part of `up` by
    # default since it depends on data the ingest step must produce first.
    # SELA_MATERIALIZE_REGION names the region to score — fixture-region by
    # default, uckermark-12073 after a real ingest run.
    command: ["pnpm", "db:materialize", "--", "--pilot-region=${SELA_MATERIALIZE_REGION:-fixture-region}"]
    profiles: ["ingest"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sela:sela@db:5432/sela}
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/richardkfm/sela:${SELA_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${SELA_APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sela:sela@db:5432/sela}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ingest:
    image: ghcr.io/richardkfm/sela-ingest:${SELA_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.ingest
    profiles: ["ingest"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sela:sela@db:5432/sela}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
