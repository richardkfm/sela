services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sela}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sela}
      POSTGRES_DB: ${POSTGRES_DB:-sela}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sela} -d ${POSTGRES_DB:-sela}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: builder
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sela:sela@db:5432/sela}
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sela:sela@db:5432/sela}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingest
    profiles: ["ingest"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sela:sela@db:5432/sela}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
